    .taint { fill: #FF7D73; }
    .pa { opacity: 0; animation: pa 14s step-end infinite; } @keyframes pa { 0% { opacity: 1; } 50% { opacity: 0; } }.pb { opacity: 0; animation: pb 14s step-end infinite; } @keyframes pb { 0% { opacity: 0; } 50% { opacity: 1; } }.sa0 { opacity: 0; animation: sa0 14s step-end infinite; } @keyframes sa0 { 0% { opacity: 0; } 2% { opacity: 1; } 48% { opacity: 0; } }.sb0 { opacity: 0; animation: sb0 14s step-end infinite; } @keyframes sb0 { 0% { opacity: 0; } 54% { opacity: 1; } }.sa1 { opacity: 0; animation: sa1 14s step-end infinite; } @keyframes sa1 { 0% { opacity: 0; } 5% { opacity: 1; } 48% { opacity: 0; } }.sb1 { opacity: 0; animation: sb1 14s step-end infinite; } @keyframes sb1 { 0% { opacity: 0; } 58% { opacity: 1; } }.sa2 { opacity: 0; animation: sa2 14s step-end infinite; } @keyframes sa2 { 0% { opacity: 0; } 14% { opacity: 1; } 48% { opacity: 0; } }.sa3 { opacity: 0; animation: sa3 14s step-end infinite; } @keyframes sa3 { 0% { opacity: 0; } 22% { opacity: 1; } 48% { opacity: 0; } }.av0 { opacity: 0; animation: av0 14s step-end infinite; } @keyframes av0 { 0% { opacity: 0; } 36% { opacity: 1; } 48% { opacity: 0; } }.av1 { opacity: 0; animation: av1 14s step-end infinite; } @keyframes av1 { 0% { opacity: 0; } 37% { opacity: 1; } 48% { opacity: 0; } }.av2 { opacity: 0; animation: av2 14s step-end infinite; } @keyframes av2 { 0% { opacity: 0; } 38% { opacity: 1; } 48% { opacity: 0; } }.av3 { opacity: 0; animation: av3 14s step-end infinite; } @keyframes av3 { 0% { opacity: 0; } 39% { opacity: 1; } 48% { opacity: 0; } }.gt { opacity: 0; animation: gt 14s step-end infinite; } @keyframes gt { 0% { opacity: 0; } 50% { opacity: 1; } }.blk { opacity: 0; animation: blk 14s step-end infinite; } @keyframes blk { 0% { opacity: 0; } 62% { opacity: 1; } }.ok { opacity: 0; animation: ok 14s step-end infinite; } @keyframes ok { 0% { opacity: 0; } 64% { opacity: 1; } }.bad { opacity: 0; animation: bad 14s step-end infinite; } @keyframes bad { 0% { opacity: 0; } 40% { opacity: 1; } 48% { opacity: 0; } }.tm { animation: tm 14s linear infinite; } @keyframes tm { 0% { transform: translateX(0); opacity: 0; } 2% { transform: translateX(0); opacity: 1; } 28% { transform: translateX(570px); opacity: 1; } 29% { transform: translateX(570px); opacity: 0; } 53% { transform: translateX(0); opacity: 0; } 54% { transform: translateX(0); opacity: 1; } 62% { transform: translateX(249px); opacity: 1; } 66% { transform: translateX(249px); opacity: 1; } 67% { opacity: 0; } 100% { transform: translateX(249px); opacity: 0; } }.tf0 { animation: tf0 14s linear infinite; } @keyframes tf0 { 0% { opacity: 0; transform: translate(0,0); } 28% { opacity: 0; transform: translate(0,0); } 29% { opacity: 1; } 36% { opacity: 1; transform: translate(70px,-48px); } 37% { opacity: 0; } 100% { opacity: 0; transform: translate(70px,-48px); } }.tf1 { animation: tf1 14s linear infinite; } @keyframes tf1 { 0% { opacity: 0; transform: translate(0,0); } 28% { opacity: 0; transform: translate(0,0); } 29% { opacity: 1; } 36% { opacity: 1; transform: translate(70px,-12px); } 37% { opacity: 0; } 100% { opacity: 0; transform: translate(70px,-12px); } }.tf2 { animation: tf2 14s linear infinite; } @keyframes tf2 { 0% { opacity: 0; transform: translate(0,0); } 28% { opacity: 0; transform: translate(0,0); } 29% { opacity: 1; } 36% { opacity: 1; transform: translate(70px,24px); } 37% { opacity: 0; } 100% { opacity: 0; transform: translate(70px,24px); } }.tf3 { animation: tf3 14s linear infinite; } @keyframes tf3 { 0% { opacity: 0; transform: translate(0,0); } 28% { opacity: 0; transform: translate(0,0); } 29% { opacity: 1; } 36% { opacity: 1; transform: translate(70px,60px); } 37% { opacity: 0; } 100% { opacity: 0; transform: translate(70px,60px); } }@media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pa, .bad, .taint, [class*="sa"], [class^="av"] { opacity: 0; }
      .pb, .gt, .blk, .ok, .sb0, .sb1 { opacity: 1; } }</style>
<rect x=".5" y=".5" width="879" height="351" rx="12" fill="#10151D" stroke="#2A3341"/><text class="cap" x="30" y="34">FIG. 4 · ONE POISONED INPUT, TWO OUTCOMES</text><text class="st pa" x="30" y="58"><tspan fill="#FF7D73">UNDEFENDED</tspan><tspan fill="#CFCAC0" dx="8">the agent is fooled, and its identity can reach everything</tspan></text><text class="st pb" x="30" y="58"><tspan fill="#86A8FF">DEFENDED</tspan><tspan fill="#CFCAC0" dx="8">the agent is fooled the same way, and nothing it can touch matters</tspan></text><path class="wire" d="M150 140 H200"/><path class="wire" d="M320 140 H370"/><path class="wire" d="M490 140 H540"/><path class="wire" d="M660 140 C 690 140, 700 92, 730 92"/><path class="wire" d="M660 140 C 690 140, 700 128, 730 128"/><path class="wire" d="M660 140 C 690 140, 700 164, 730 164"/><path class="wire" d="M660 140 C 690 140, 700 200, 730 200"/><rect class="box" x="30" y="112" width="120" height="56" rx="6"/><text class="bt" x="90" y="136">untrusted input</text><text class="bs" x="90" y="154">log · ticket · doc</text><rect class="hit sa0" x="30" y="112" width="120" height="56" rx="6"/><rect class="hit sb0" x="30" y="112" width="120" height="56" rx="6"/><rect class="box" x="200" y="112" width="120" height="56" rx="6"/><text class="bt" x="260" y="136">AI agent</text><text class="bs" x="260" y="154">LLM + tools</text><rect class="hit sa1" x="200" y="112" width="120" height="56" rx="6"/><rect class="hit sb1" x="200" y="112" width="120" height="56" rx="6"/><rect class="box" x="370" y="112" width="120" height="56" rx="6"/><text class="bt" x="430" y="136">identity</text><text class="bs" x="430" y="154">token · kubeconfig</text><rect class="hit sa2" x="370" y="112" width="120" height="56" rx="6"/><rect class="box" x="540" y="112" width="120" height="56" rx="6"/><text class="bt" x="600" y="136">control plane</text><text class="bs" x="600" y="154">k8s · Slurm · IAM</text><rect class="hit sa3" x="540" y="112" width="120" height="56" rx="6"/><text class="ht sb1" x="260" y="184">FOOLED</text><rect class="box" x="730" y="78" width="120" height="28" rx="4"/><text class="bt" x="790" y="96" style="font-weight:500">model weights</text><g class="av0"><rect class="hit" x="730" y="78" width="120" height="28" rx="4" style="fill:#10151D;fill-opacity:1"/><rect class="hit" x="730" y="78" width="120" height="28" rx="4"/><text class="ht" x="790" y="96">EXFILTRATED</text></g><rect class="box" x="730" y="114" width="120" height="28" rx="4"/><text class="bt" x="790" y="132" style="font-weight:500">checkpoints</text><g class="av1"><rect class="hit" x="730" y="114" width="120" height="28" rx="4" style="fill:#10151D;fill-opacity:1"/><rect class="hit" x="730" y="114" width="120" height="28" rx="4"/><text class="ht" x="790" y="132">BACKDOORED</text></g><rect class="box" x="730" y="150" width="120" height="28" rx="4"/><text class="bt" x="790" y="168" style="font-weight:500">training data</text><g class="av2"><rect class="hit" x="730" y="150" width="120" height="28" rx="4" style="fill:#10151D;fill-opacity:1"/><rect class="hit" x="730" y="150" width="120" height="28" rx="4"/><text class="ht" x="790" y="168">POISONED</text></g><rect class="box" x="730" y="186" width="120" height="28" rx="4"/><text class="bt" x="790" y="204" style="font-weight:500">GPU fabric</text><g class="av3"><rect class="hit" x="730" y="186" width="120" height="28" rx="4" style="fill:#10151D;fill-opacity:1"/><rect class="hit" x="730" y="186" width="120" height="28" rx="4"/><text class="ht" x="790" y="204">SNIFFED</text></g><g class="gt"><rect class="gate" x="342" y="104" width="6" height="72" rx="3"/><line class="lead" x1="345" y1="178" x2="345" y2="210"/><text class="gh" x="345" y="222" style="text-anchor:middle">TOOL BOUNDARY</text><text class="gl" x="345" y="236" style="text-anchor:middle">read-only tools · actions only via an allowlisted, audited executor</text><rect class="gate" x="512" y="104" width="6" height="72" rx="3"/><line class="lead" x1="515" y1="178" x2="515" y2="246"/><text class="gh" x="515" y="258" style="text-anchor:middle">IDENTITY</text><text class="gl" x="515" y="272" style="text-anchor:middle">short-lived per-task credentials · workload identity · no ambient admin</text><rect class="gate" x="692" y="104" width="6" height="72" rx="3"/><line class="lead" x1="695" y1="178" x2="695" y2="282"/><text class="gh" x="850" y="294" style="text-anchor:end">ARTIFACTS + FABRIC</text><text class="gl" x="850" y="308" style="text-anchor:end">signed weights · segmented, encrypted fabric · attested GPUs</text></g><g class="blk"><circle cx="345" cy="92" r="9" fill="#10151D" stroke="#FF7D73" stroke-width="1.8"/><path d="M341 88 l8 8 M349 88 l-8 8" stroke="#FF7D73" stroke-width="1.8" stroke-linecap="round"/><text class="ht" x="345" y="76">DENIED · LOGGED</text></g><text class="ht ok" x="790" y="234" style="fill:#86A8FF">0 / 4 REACHED</text><text class="ht bad" x="790" y="234">4 / 4 REACHED</text><circle class="taint tm" cx="90" cy="140" r="5" filter="url(#glow)"/><circle class="taint tf0" cx="660" cy="140" r="4" filter="url(#glow)"/><circle class="taint tf1" cx="660" cy="140" r="4" filter="url(#glow)"/><circle class="taint tf2" cx="660" cy="140" r="4" filter="url(#glow)"/><circle class="taint tf3" cx="660" cy="140" r="4" filter="url(#glow)"/><g class="pa"><text class="ph" x="30" y="236">One injected sentence in a log line becomes <tspan fill="#FF7D73">kubectl</tspan>, <tspan fill="#FF7D73">scp</tspan> and a fabric tap.</text><text class="ph" x="30" y="256">No exploit needed: the agent's permissions <tspan fill="#FF7D73">are</tspan> the blast radius.</text><text class="ph" x="30" y="276" style="fill:#A3ABB8">RDMA bypasses the host kernel, so host firewalls and eBPF never see the fabric tap.</text></g><text class="foot" x="30" y="332">Assume the model will be fooled. <tspan fill="#86A8FF">Design so that being fooled is cheap.</tspan></text>
</svg>
