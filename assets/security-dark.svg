    .gl { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #CFCAC0; }
    .ph { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #CFCAC0; }
    .gh { font: 700 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #86A8FF; letter-spacing: .06em; }
    .lead { stroke: #86A8FF; stroke-width: 1; stroke-dasharray: 2 3; }
