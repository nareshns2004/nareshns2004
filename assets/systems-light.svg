lay:-0.70s"/><rect x="794" y="148" width="28" height="26" rx="2" fill="#F7F5F0" stroke="#15171C" stroke-width="1.2"/><rect class="dc" x="798" y="152" width="20" height="18" rx="1" style="animation-delay:-1.05s"/><line x1="590" y1="142" x2="730" y2="142" stroke="#15171C" stroke-width="1.3"/><line x1="590" y1="152" x2="730" y2="152" stroke="#15171C" stroke-width="1.3"/><text class="bt" x="660" y="132">GPUDirect RDMA</text><text class="bt" x="660" y="172" style="fill:#555C6A">re-layout kernel</text><rect class="kvb" x="594" y="143.5" width="12" height="7" rx="1" style="animation-delay:-0.0s"/><rect class="kvb" x="594" y="143.5" width="12" height="7" rx="1" style="animation-delay:-2.0s"/><rect class="kvb" x="594" y="143.5" width="12" height="7" rx="1" style="animation-delay:-4.0s"/><path class="hb" d="M630 218 L540 200"/><path class="hb" d="M690 218 L780 200"/><rect class="box" x="600" y="218" width="120" height="28" rx="4"/><text class="bt" x="660" y="236">coordinator</text><text class="foot" x="470" y="272">safe when the network fails mid-transfer</text>
