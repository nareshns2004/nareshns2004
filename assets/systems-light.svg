">detect → attribute → smallest safe recovery</text><circle class="dot d0" cx="158" cy="111" r="3.4"/><circle class="dot d1" cx="158" cy="155" r="3.4"/><circle class="dot d2" cx="158" cy="199" r="3.4"/>
