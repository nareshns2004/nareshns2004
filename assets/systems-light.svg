<svg xmlns="http://www.w3.org/2000/svg" width="880" height="296" viewBox="0 0 880 296" role="img" aria-labelledby="t d">
<title id="t">The two problems, as systems</title>
<desc id="d">Left, goodput: NCCL flight-recorder, DCGM/Xid and NIC/PFC counter evidence converge on a topology join that names the culprit rank and component, then the smallest safe recovery is chosen: communicator re-init before node swap before peer checkpoint restore. Right, kvwire: a compute-bound prefill pool sends KV-cache blocks over GPUDirect RDMA, through a re-layout kernel, to a memory-bound decode pool, supervised by a coordinator that stays correct if the network fails mid-transfer.</desc>
<style>
    .cap { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; letter-spacing: .08em; }
    .pn { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .ps { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; }
    .box { fill: #EFECE4; stroke: #BDB6A6; stroke-width: 1.2; }
    .bt { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #353A44; text-anchor: middle; }
    .dim { fill: none; stroke: #BDB6A6; stroke-dasharray: 3 3; }
    .dt { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; }
    .wire { fill: none; stroke: #BDB6A6; stroke-width: 1.3; }
    .foot { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; }
    .dot { fill: #1D4ED8; }
    .kvb { fill: #B4470E; animation: kv 6s linear infinite; }
    @keyframes kv { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; }
                    100% { transform: translateX(124px); opacity: 0; } }
    .pf { fill: #1D4ED8; animation: pf 1.1s ease-in-out infinite alternate; }
    @keyframes pf { from { fill-opacity: .25; } to { fill-opacity: .9; } }
    .dc { fill: #B4470E; animation: dc 2.4s ease-in-out infinite alternate; }
    @keyframes dc { from { fill-opacity: .2; } to { fill-opacity: .7; } }
    .hb { fill: none; stroke: #555C6A; stroke-width: 1.2; stroke-dasharray: 3 4; animation: hb 1.4s linear infinite; }
    @keyframes hb { to { stroke-dashoffset: -14; } }
    .d0 { animation: d0 8s linear infinite; } @keyframes d0 { 0% { transform: translate(0px,0px); opacity: 1; } 10% { transform: translate(16px,0px); } 20% { transform: translate(16px,44px); } 28% { transform: translate(32px,44px); opacity: 1; } 30% { transform: translate(32px,44px); opacity: 0; } 100% { transform: translate(32px,44px); opacity: 0; } }.d1 { animation: d1 8s linear infinite; } @keyframes d1 { 0% { transform: translate(0px,0px); opacity: 1; } 10% { transform: translate(16px,0px); } 20% { transform: translate(16px,0px); } 28% { transform: translate(32px,0px); opacity: 1; } 30% { transform: translate(32px,0px); opacity: 0; } 100% { transform: translate(32px,0px); opacity: 0; } }.d2 { animation: d2 8s linear infinite; } @keyframes d2 { 0% { transform: translate(0px,0px); opacity: 1; } 10% { transform: translate(16px,0px); } 20% { transform: translate(16px,-44px); } 28% { transform: translate(32px,-44px); opacity: 1; } 30% { transform: translate(32px,-44px); opacity: 0; } 100% { transform: translate(32px,-44px); opacity: 0; } }.jhi { opacity: 0; animation: jhi 8s step-end infinite; } @keyframes jhi { 0% { opacity: 0; } 30% { opacity: 1; } }.cul { opacity: 0; animation: cul 8s step-end infinite; } @keyframes cul { 0% { opacity: 0; } 40% { opacity: 1; } }.pick { opacity: 0; animation: pick 8s step-end infinite; } @keyframes pick { 0% { opacity: 0; } 55% { opacity: 1; } }@media (prefers-reduced-motion: reduce) {
      .dot, .kvb, .pf, .dc, .hb, .jhi, .cul, .pick { animation: none !important; }
      .dot { opacity: 0; } .jhi, .cul, .pick { opacity: 1; } .kvb { transform: translateX(62px); } }</style>
<rect x=".5" y=".5" width="879" height="295" rx="12" fill="#F7F5F0" stroke="#D9D4C7"/>
<text class="cap" x="30" y="34">FIG. 2 · THE TWO PROBLEMS, AS SYSTEMS</text>
<line x1="445" y1="52" x2="445" y2="276" stroke="#D9D4C7"/>
