<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="t d">
<title id="t">PFC pause propagation: victim vs origin</title>
<desc id="d">Four hosts send incast traffic through leaf A, a spine and leaf B to one receiver, while host H4 sends an unrelated flow to R2. Leaf B's egress queue toward the incast receiver fills, and PFC pause frames propagate upstream hop by hop: leaf B to spine, spine to leaf A, leaf A to every host. H4's flow stalls even though it never uses the congested port: it is a victim. The origin is the leaf B egress port; nicprof follows pause counters back to it.</desc>
<style>
    .cap { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #A3ABB8; letter-spacing: .08em; }
    .sw { fill: #171E29; stroke: #ECE8E0; stroke-width: 1.3; }
    .st { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ECE8E0; text-anchor: middle; letter-spacing: .06em; }
    .hs { fill: #10151D; stroke: #3B4656; stroke-width: 1.2; }
    .ht { font: 500 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #CFCAC0; text-anchor: middle; }
    .wire { fill: none; stroke: #3B4656; stroke-width: 1.4; }
    .pz { fill: none; stroke: #F0935C; stroke-width: 2.4; stroke-dasharray: 5 4; }
    .pt { font: 600 10px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #F0935C; text-anchor: middle; letter-spacing: .06em; }
    .note { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .dot { fill: #86A8FF; }
    .q { fill: #FF7D73; transform-box: fill-box; transform-origin: center bottom; animation: q 12s linear infinite; }
    @keyframes q { 0% { transform: scaleY(0); } 18% { transform: scaleY(0); } 30% { transform: scaleY(1); } 100% { transform: scaleY(1); } }
    .f0 { animation: f 12s linear infinite; animation-delay: -0.00s; }.f1 { animation: f 12s linear infinite; animation-delay: -0.25s; }.f2 { animation: f 12s linear infinite; animation-delay: -0.50s; }@keyframes f { 0% { transform: translateX(0); opacity: 1; } 22% { transform: translateX(80px); opacity: 1; } 23% { opacity: 0; } 100% { opacity: 0; } }.hot { opacity: 0; animation: hot 12s step-end infinite; } @keyframes hot { 0% { opacity: 0; } 20% { opacity: 1; } }.p1 { opacity: 0; animation: p1 12s step-end infinite; } @keyframes p1 { 0% { opacity: 0; } 32% { opacity: 1; } }.p2 { opacity: 0; animation: p2 12s step-end infinite; } @keyframes p2 { 0% { opacity: 0; } 42% { opacity: 1; } }.p3 { opacity: 0; animation: p3 12s step-end infinite; } @keyframes p3 { 0% { opacity: 0; } 52% { opacity: 1; } }.vic { opacity: 0; animation: vic 12s step-end infinite; } @keyframes vic { 0% { opacity: 0; } 60% { opacity: 1; } }.org { opacity: 0; animation: org 12s step-end infinite; } @keyframes org { 0% { opacity: 0; } 70% { opacity: 1; } }@media (prefers-reduced-motion: reduce) {
      .q, .dot, .hot, .p1, .p2, .p3, .vic, .org { animation: none !important; }
      .dot { opacity: 0; } .hot, .p1, .p2, .p3, .vic, .org { opacity: 1; } .q { transform: none; } }</style>
<rect x=".5" y=".5" width="879" height="279" rx="12" fill="#10151D" stroke="#2A3341"/><text class="cap" x="30" y="34">FIG. 3 · PFC PAUSE PROPAGATION: VICTIM VS ORIGIN</text><path class="wire" d="M110 76 H190"/><path class="wire" d="M110 104 H190"/><path class="wire" d="M110 132 H190"/><path class="wire" d="M110 160 H190"/><path class="wire" d="M110 202 H190"/><path class="wire" d="M290 145 H390"/><path class="wire" d="M490 145 H590"/><path class="wire" d="M690 115 H770"/><path class="wire" d="M690 185 H770"/><path class="hot" d="M690 115 H770" stroke="#FF7D73" stroke-width="2.6" fill="none"/><g class="p1"><path class="pz" d="M490 145 H590"/><text class="pt" x="540" y="137">◀ PAUSE</text></g><g class="p2"><path class="pz" d="M290 145 H390"/><text class="pt" x="340" y="137">◀ PAUSE</text></g><g class="p3"><path class="pz" d="M110 76 H190"/><path class="pz" d="M110 104 H190"/><path class="pz" d="M110 132 H190"/><path class="pz" d="M110 160 H190"/><path class="pz" d="M110 202 H190"/></g><rect class="hs" x="30" y="65" width="80" height="22" rx="3"/><text class="ht" x="70" y="80">H0</text><rect class="hs" x="30" y="93" width="80" height="22" rx="3"/><text class="ht" x="70" y="108">H1</text><rect class="hs" x="30" y="121" width="80" height="22" rx="3"/><text class="ht" x="70" y="136">H2</text><rect class="hs" x="30" y="149" width="80" height="22" rx="3"/><text class="ht" x="70" y="164">H3</text><rect class="hs" x="30" y="191" width="80" height="22" rx="3"/><text class="ht" x="70" y="206">H4</text><rect class="sw" x="190" y="88" width="100" height="114" rx="6"/><text class="st" x="240" y="149">LEAF A</text><rect class="sw" x="390" y="88" width="100" height="114" rx="6"/><text class="st" x="440" y="149">SPINE</text><rect class="sw" x="590" y="88" width="100" height="114" rx="6"/><text class="st" x="640" y="149">LEAF B</text><rect x="668" y="98" width="14" height="30" fill="none" stroke="#3B4656"/><rect class="q" x="669" y="99" width="12" height="28"/><rect class="hs" x="770" y="104" width="80" height="22" rx="3"/><text class="ht" x="810" y="119">R · incast</text><rect class="hs" x="770" y="174" width="80" height="22" rx="3"/><text class="ht" x="810" y="189">R2</text><circle class="dot f0" cx="290" cy="145" r="3.4"/><circle class="dot f1" cx="490" cy="145" r="3.4"/><circle class="dot f2" cx="690" cy="115" r="3.4"/><text class="note" x="30" y="56" style="fill:#A3ABB8">H0–H3 → R (incast) · H4 → R2 (unrelated)</text><g class="vic"><rect x="28" y="189" width="84" height="26" rx="4" fill="none" stroke="#F0935C" stroke-width="2"/><text class="note" x="30" y="240" style="fill:#F0935C">victim · H4 → R2 stalls, though it never touches the hot port</text></g><g class="org"><rect x="664" y="94" width="22" height="38" rx="3" fill="none" stroke="#FF7D73" stroke-width="2"/><text class="note" x="690" y="72" text-anchor="middle" style="fill:#FF7D73">origin · leaf B egress → R</text><text class="note" x="30" y="262" style="fill:#86A8FF">nicprof traces pause counters hop by hop to the origin, not the loudest victim</text></g>
</svg>
