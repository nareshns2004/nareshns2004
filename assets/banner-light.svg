<text x="712" y="138" text-anchor="middle" style="font:500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#555C6A">8 ranks</text>
<text class="lbl l0" x="712" y="158" fill="#555C6A">all ranks busy</text><text class="lbl l1" x="712" y="158" fill="#C2261D">link 2→3 fails</text><text class="lbl l2" x="712" y="158" fill="#B4470E">stall spreads</text><text class="lbl l3" x="712" y="158" fill="#C2261D">all 8 time out</text><text class="lbl l4" x="712" y="158" fill="#1D4ED8">restore → spare</text><text class="lbl l5" x="712" y="158" fill="#555C6A">training resumes</text>
