<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
<title id="t">Naresh Kumar: GPU cluster networking and distributed-training infrastructure</title>
<desc id="d">A GPU cluster is only as fast as its slowest link and as reliable as its weakest. I make it lose less time to both. An animated ring of eight GPUs loses a link, every rank stalls and times out, the job restores onto a spare and resumes; a goodput timeline records the cost.</desc>
<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#EFECE4"/><line x1="0" y1="0" x2="0" y2="5" stroke="#555C6A" stroke-width="1.6"/></pattern></defs>
<style>
    .k { font: 600 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .08em; fill: #555C6A; }
    .h { font: 600 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #15171C; letter-spacing: -.01em; }
    .s { fill: #B4470E; } .r { fill: #1D4ED8; }
    .sub { font: 500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #353A44; }
    .node rect { fill: #F7F5F0; stroke: #15171C; stroke-width: 1.4; }
    .node text { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #15171C; text-anchor: middle; }
    .edge { stroke: #15171C; stroke-width: 1.3; }
    .lbl { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; text-anchor: middle; opacity: 0; }
    .cap { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #555C6A; letter-spacing: .06em; }
    .pk { fill: #1D4ED8; }
    .spin { transform-box: view-box; transform-origin: 712px 140px; animation: spin 12s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 40% { transform: rotate(225deg); }
                      85% { transform: rotate(225deg); } 100% { transform: rotate(360deg); } }
    .bad { animation: bad 12s step-end infinite; stroke: #15171C; }
    @keyframes bad { 0% { stroke: #15171C; stroke-dasharray: none; } 40% { stroke: #C2261D; stroke-dasharray: 5 4; stroke-width: 2.2; }
                     85% { stroke: #15171C; stroke-dasharray: none; stroke-width: 1.3; } }
    .x { stroke: #C2261D; stroke-width: 2.6; opacity: 0; animation: x 12s step-end infinite; }
    @keyframes x { 0% { opacity: 0; } 40% { opacity: 1; } 85% { opacity: 0; } }
    .l0 { animation: l0 12s step-end infinite; } @keyframes l0 { 0% { opacity: 1; } 40% { opacity: 0; } }.l1 { animation: l1 12s step-end infinite; } @keyframes l1 { 0% { opacity: 0; } 40% { opacity: 1; } 46% { opacity: 0; } }.l2 { animation: l2 12s step-end infinite; } @keyframes l2 { 0% { opacity: 0; } 46% { opacity: 1; } 60% { opacity: 0; } }.l3 { animation: l3 12s step-end infinite; } @keyframes l3 { 0% { opacity: 0; } 60% { opacity: 1; } 74% { opacity: 0; } }.l4 { animation: l4 12s step-end infinite; } @keyframes l4 { 0% { opacity: 0; } 74% { opacity: 1; } 85% { opacity: 0; } }.l5 { animation: l5 12s step-end infinite; } @keyframes l5 { 0% { opacity: 0; } 85% { opacity: 1; } }.n3 rect { animation: n3 12s step-end infinite; } @keyframes n3 { 0% { stroke: #15171C; } 46.0% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n4 rect { animation: n4 12s step-end infinite; } @keyframes n4 { 0% { stroke: #15171C; } 47.8% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n5 rect { animation: n5 12s step-end infinite; } @keyframes n5 { 0% { stroke: #15171C; } 49.5% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n6 rect { animation: n6 12s step-end infinite; } @keyframes n6 { 0% { stroke: #15171C; } 51.2% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n7 rect { animation: n7 12s step-end infinite; } @keyframes n7 { 0% { stroke: #15171C; } 53.0% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n0 rect { animation: n0 12s step-end infinite; } @keyframes n0 { 0% { stroke: #15171C; } 54.8% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n1 rect { animation: n1 12s step-end infinite; } @keyframes n1 { 0% { stroke: #15171C; } 56.5% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.n2 rect { animation: n2 12s step-end infinite; } @keyframes n2 { 0% { stroke: #15171C; } 58.2% { stroke: #B4470E; stroke-dasharray: 4 3; } 60% { stroke: #C2261D; stroke-dasharray: none; } 74% { stroke: #15171C; } }.spare { opacity: 0; animation: spare 12s step-end infinite; } @keyframes spare { 0% { opacity: 0; } 74% { opacity: 1; } 100% { opacity: 1; } }.orig { animation: orig 12s step-end infinite; } @keyframes orig { 0% { opacity: 1; } 74% { opacity: 0; } }.g0 { transform-box: fill-box; transform-origin: left center; animation: g0 12s linear infinite; }@keyframes g0 { 0% { transform: scaleX(0); } 0% { transform: scaleX(0); } 40% { transform: scaleX(1); } 100% { transform: scaleX(1); } }.g1 { transform-box: fill-box; transform-origin: left center; animation: g1 12s linear infinite; }@keyframes g1 { 0% { transform: scaleX(0); } 40% { transform: scaleX(0); } 74% { transform: scaleX(1); } 100% { transform: scaleX(1); } }.g2 { transform-box: fill-box; transform-origin: left center; animation: g2 12s linear infinite; }@keyframes g2 { 0% { transform: scaleX(0); } 74% { transform: scaleX(0); } 85% { transform: scaleX(1); } 100% { transform: scaleX(1); } }.g3 { transform-box: fill-box; transform-origin: left center; animation: g3 12s linear infinite; }@keyframes g3 { 0% { transform: scaleX(0); } 85% { transform: scaleX(0); } 100% { transform: scaleX(1); } 100% { transform: scaleX(1); } }@media (prefers-reduced-motion: reduce) {
      .spin, .bad, .x, .lbl, .node rect, .spare, .orig, [class^="g"] { animation: none !important; }
      .l4 { opacity: 1; } .spare { opacity: 1; } .orig { opacity: 0; }
      .x { opacity: 0; } [class^="g"] { transform: none; } }</style>
<rect x=".5" y=".5" width="879" height="299" rx="12" fill="#F7F5F0" stroke="#D9D4C7"/>
<text class="k" x="36" y="48">NARESH KUMAR</text>
<text class="k" x="36" y="68" style="font-weight:500">GPU CLUSTER NETWORKING · DISTRIBUTED-TRAINING INFRA</text>
<text class="h" x="36" y="116">A GPU cluster is only as fast as its</text>
<text class="h" x="36" y="150"><tspan class="s">slowest link</tspan> and as reliable as its</text>
<text class="h" x="36" y="184"><tspan class="r">weakest</tspan>. I make it lose less time</text>
<text class="h" x="36" y="218">to both.</text>
<text class="sub" x="36" y="262">~9 yrs below the framework layer</text>
<text class="sub" x="36" y="281" style="fill:#555C6A">RDMA · RoCE · NCCL · DPDK · SR-IOV · KVM · eBPF</text>
<line x1="560" y1="28" x2="560" y2="272" stroke="#D9D4C7"/>
<text class="cap" x="580" y="30">FIG. 0 · RING ALL-REDUCE</text>
<line class="edge" x1="712.0" y1="52.0" x2="774.2" y2="77.8"/><line class="edge" x1="774.2" y1="77.8" x2="800.0" y2="140.0"/><line class="edge bad" x1="800.0" y1="140.0" x2="774.2" y2="202.2"/><line class="edge" x1="774.2" y1="202.2" x2="712.0" y2="228.0"/><line class="edge" x1="712.0" y1="228.0" x2="649.8" y2="202.2"/><line class="edge" x1="649.8" y1="202.2" x2="624.0" y2="140.0"/><line class="edge" x1="624.0" y1="140.0" x2="649.8" y2="77.8"/><line class="edge" x1="649.8" y1="77.8" x2="712.0" y2="52.0"/><path class="x" d="M781.1,165.1 L793.1,177.1 M793.1,165.1 L781.1,177.1"/>
<g class="spin"><circle class="pk" cx="743.3" cy="64.4" r="3.6"/><circle class="pk" cx="787.6" cy="108.7" r="3.6"/><circle class="pk" cx="787.6" cy="171.3" r="3.6"/><circle class="pk" cx="743.3" cy="215.6" r="3.6"/><circle class="pk" cx="680.7" cy="215.6" r="3.6"/><circle class="pk" cx="636.4" cy="171.3" r="3.6"/><circle class="pk" cx="636.4" cy="108.7" r="3.6"/><circle class="pk" cx="680.7" cy="64.4" r="3.6"/></g>
